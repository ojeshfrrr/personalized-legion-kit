name: Build Project Legion

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-wpf:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore application project
        run: dotnet restore ProjectLegion.slnf -p:Platform=x64 --disable-parallel -m:1 -nr:false
      - name: Build application
        run: dotnet build ProjectLegion.slnf -c Release -p:Platform=x64 -p:UseSharedCompilation=false --no-restore -m:1 -nr:false
